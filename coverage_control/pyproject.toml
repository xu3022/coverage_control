[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coverage-control"
version = "0.1.0"
description = "Known-sensitivity multi-robot Voronoi coverage-control simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "matplotlib>=3.7,<4",
    "shapely>=2.0,<3",
    "geovoronoi>=0.4,<0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
coverage-control = "coverage_control.coverage_control:main"

[tool.setuptools.packages.find]
include = ["coverage_control*"]

[tool.setuptools.package-data]
coverage_control = ["assets/*.svg", "position/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
